<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="agentwatch: watch your Claude Code subagents. Zero tokens, one small binary, MCP tools for your agents.">
  <style>
    .t { font-family: 'Trebuchet MS', Verdana, Arial, sans-serif; }
    .m { font-family: 'Lucida Console', Consolas, 'Courier New', monospace; }
    @keyframes type { from { width: 0 } to { width: 760px } }
    @keyframes caret { 50% { opacity: 0 } }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
    @keyframes cycle1 { 0%, 30% { fill: #2f6fed } 34%, 64% { fill: #8b5cf6 } 68%, 100% { fill: #1f9d55 } }
    @keyframes cycle2 { 0%, 45% { fill: #8b5cf6 } 50%, 100% { fill: #2f6fed } }
    @keyframes scroll { from { transform: translateX(0) } to { transform: translateX(-1100px) } }
    @keyframes sweep { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    #typed { animation: type 3.2s steps(46) .6s both; }
    #caret { animation: caret 1s steps(1) infinite; }
    .run { animation: pulse 1.4s ease-in-out infinite; }
    #c1 { animation: cycle1 9s linear infinite; }
    #c2 { animation: cycle2 7s linear infinite; }
    #ticker { animation: scroll 22s linear infinite; }
    #radar { transform-origin: 140px 196px; animation: sweep 4s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } #typed { width: 760px; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6fd6"/><stop offset=".7" stop-color="#7ab6f3"/><stop offset="1" stop-color="#b9dcff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d8bff"/><stop offset=".12" stop-color="#0a5ee0"/><stop offset=".9" stop-color="#0446c8"/><stop offset="1" stop-color="#0a3fa0"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4ec"/><stop offset="1" stop-color="#ece9d8"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59b"/><stop offset=".45" stop-color="#ffb52e"/><stop offset=".5" stop-color="#ff7a00"/><stop offset="1" stop-color="#d83a00"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa8ff"/><stop offset=".48" stop-color="#1f6fe0"/><stop offset="1" stop-color="#0b3d9c"/></linearGradient>
    <radialGradient id="iris" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#b8ffb0"/><stop offset=".45" stop-color="#3cc84a"/><stop offset="1" stop-color="#11782a"/></radialGradient>
    <radialGradient id="hill" cx=".5" cy="1" r=".9"><stop offset="0" stop-color="#5fbf3c"/><stop offset="1" stop-color="#2f8a1e"/></radialGradient>
    <clipPath id="typeclip"><rect id="typed" x="300" y="176" width="0" height="40"/></clipPath>
    <clipPath id="tickclip"><rect x="40" y="300" width="1200" height="24"/></clipPath>
    <clipPath id="eye"><path d="M98 196 C114 170 166 170 182 196 C166 222 114 222 98 196 Z"/></clipPath>
  </defs>

  <rect width="1280" height="340" fill="url(#sky)"/>
  <ellipse cx="300" cy="420" rx="700" ry="150" fill="url(#hill)"/>
  <ellipse cx="1100" cy="440" rx="600" ry="150" fill="#3c9a28"/>

  <!-- window -->
  <g filter="drop-shadow(0 8px 18px rgba(0,0,40,.35))">
    <rect x="30" y="18" width="1220" height="300" rx="9" fill="url(#bar)"/>
    <rect x="34" y="50" width="1212" height="264" fill="url(#body)"/>
  </g>
  <text x="52" y="41" class="t" font-size="17" font-weight="bold" fill="#fff" style="text-shadow:1px 1px #0a2a7a">agentwatch.exe</text>
  <g transform="translate(1158 24)">
    <rect width="22" height="21" rx="3" fill="#2b72f5" stroke="#fff"/><rect x="6" y="13" width="9" height="3" fill="#fff"/>
    <rect x="26" width="22" height="21" rx="3" fill="#2b72f5" stroke="#fff"/><rect x="31" y="5" width="12" height="10" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="52" width="22" height="21" rx="3" fill="#e0472b" stroke="#fff"/><path d="M58 5 L68 15 M68 5 L58 15" stroke="#fff" stroke-width="2.5"/>
  </g>

  <!-- logo -->
  <rect x="80" y="136" width="120" height="120" rx="24" fill="url(#tile)" stroke="#0a2f78" stroke-width="3"/>
  <path d="M98 196 C114 170 166 170 182 196 C166 222 114 222 98 196 Z" fill="#f4f9ff" stroke="#0a2f78" stroke-width="3"/>
  <g clip-path="url(#eye)">
    <circle cx="140" cy="196" r="20" fill="url(#iris)"/><circle cx="140" cy="196" r="8" fill="#06210c"/>
    <path id="radar" d="M140 196 L140 172 A24 24 0 0 1 160 184 Z" fill="#fff" opacity=".35"/>
    <circle cx="133" cy="189" r="4" fill="#fff"/>
  </g>
  <path d="M86 156 C86 144 94 140 106 140 H174 C186 140 194 144 194 156 C174 168 106 168 86 156 Z" fill="#fff" opacity=".35"/>

  <!-- WordArt title -->
  <text x="300" y="140" class="t" font-size="92" font-weight="bold" font-style="italic" fill="#1b3f8f" opacity=".35" transform="translate(6 6)">agentwatch</text>
  <text x="300" y="140" class="t" font-size="92" font-weight="bold" font-style="italic" fill="url(#word)" stroke="#8a2c00" stroke-width="2.5">agentwatch</text>

  <!-- typed tagline -->
  <g clip-path="url(#typeclip)"><text x="300" y="204" class="m" font-size="23" fill="#123">watch your Claude Code subagents. zero tokens.</text></g>
  <rect id="caret" x="946" y="183" width="12" height="24" fill="#123" opacity=".8"/>

  <!-- lanes -->
  <g class="t" font-size="15" font-weight="bold" fill="#fff">
    <rect id="c1" x="300" y="232" width="104" height="26" rx="13" fill="#2f6fed" class="run"/><text x="352" y="250" text-anchor="middle">explore</text>
    <rect id="c2" x="414" y="232" width="104" height="26" rx="13" fill="#8b5cf6"/><text x="466" y="250" text-anchor="middle">tests</text>
    <rect x="528" y="232" width="104" height="26" rx="13" fill="#1f9d55"/><text x="580" y="250" text-anchor="middle">review</text>
    <rect x="642" y="232" width="104" height="26" rx="13" fill="#d97706"/><text x="694" y="250" text-anchor="middle">plan</text>
  </g>
  <text x="760" y="251" class="t" font-size="15" fill="#334">← live status for every agent</text>

  <!-- 88x31-style badges -->
  <g class="t" font-size="11" font-weight="bold">
    <rect x="1000" y="78" width="88" height="31" fill="#222" stroke="#999"/><text x="1044" y="92" text-anchor="middle" fill="#ffb52e">RUST</text><text x="1044" y="104" text-anchor="middle" fill="#ddd">powered</text>
    <rect x="1094" y="78" width="88" height="31" fill="#0a5ee0" stroke="#9cf"/><text x="1138" y="92" text-anchor="middle" fill="#fff">MCP</text><text x="1138" y="104" text-anchor="middle" fill="#cfe">ready</text>
    <rect x="1000" y="115" width="88" height="31" fill="#1f9d55" stroke="#9f9"/><text x="1044" y="129" text-anchor="middle" fill="#fff">0 TOKENS</text><text x="1044" y="141" text-anchor="middle" fill="#dfd">to collect</text>
    <rect x="1094" y="115" width="88" height="31" fill="#eee" stroke="#666"/><text x="1138" y="129" text-anchor="middle" fill="#333">~50 MB</text><text x="1138" y="141" text-anchor="middle" fill="#555">0.8% CPU</text>
  </g>

  <!-- marquee -->
  <rect x="34" y="296" width="1212" height="18" fill="#0a246a"/>
  <g clip-path="url(#tickclip)">
    <g id="ticker" class="m" font-size="13" fill="#ffe680">
      <text x="40" y="310">★ NEW! rewritten in Rust ★ agentwatch_wait: stop polling your subagents ★ redacts emails, tokens and secrets ★ Windows · macOS · Linux ★ </text>
      <text x="1140" y="310">★ NEW! rewritten in Rust ★ agentwatch_wait: stop polling your subagents ★ redacts emails, tokens and secrets ★ Windows · macOS · Linux ★ </text>
    </g>
  </g>
</svg>
