[package]
name = "agentwatch"
version = "0.2.0"
edition = "2021"
description = "A local web dashboard for watching your Claude Code sessions and subagents. Zero tokens, read-only."
license = "MIT"
repository = "https://github.com/coreylallojr/agentwatch"
readme = "../README.md"

[[bin]]
name = "agentwatch"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha1_smol = "1"
url = "2"
httparse = "1"
notify = { version = "7", default-features = false }
ctrlc = { version = "=3.4.5", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
