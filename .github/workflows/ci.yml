name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust tests
        run: cargo test --release --manifest-path rust/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Node tests (the parity oracle)
        run: npm test
      - name: Static assets match the Node implementation
        run: node parity/extract-assets.mjs --check
      - name: Parity, MCP and live-update checks
        shell: bash
        run: |
          bin=rust/target/release/agentwatch
          [ -f "$bin.exe" ] && bin="$bin.exe"
          now=$(node parity/fixtures.mjs .parity-fx)
          fail=0
          # each check's tail becomes an annotation on failure, so it is readable on the public run page
          check() {
            name=$1; shift
            if "$@" > "out-$name.txt" 2>&1; then echo "ok   $name: $(tail -n 1 "out-$name.txt")"
            else
              fail=1
              echo "FAIL $name"; cat "out-$name.txt"
              msg=$(tail -n 40 "out-$name.txt" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=${name} failed on ${{ runner.os }}::${msg}"
            fi
          }
          check dump node parity/run.mjs --projects .parity-fx --now "$now" --bin "$bin"
          check http node parity/http.mjs --projects .parity-fx --bin "$bin"
          check live node parity/live.mjs --bin "$bin"
          check mcp  node parity/mcp.mjs --bin "$bin"
          exit $fail
      - name: Plugin manifest and website
        if: runner.os == 'Linux'
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','.mcp.json','docs/assets/demo-output.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          node --check docs/assets/site.js
