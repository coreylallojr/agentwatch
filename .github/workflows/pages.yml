name: pages

# Publishes docs/ (the landing page) to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]   # the github-pages environment only accepts deployments from the default branch
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is GitHub Pages enabled?
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          fi
      - uses: actions/checkout@v5
        if: steps.enabled.outputs.on == 'true'
      - uses: actions/configure-pages@v5
        if: steps.enabled.outputs.on == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.enabled.outputs.on == 'true'
        with:
          path: docs
      - id: deploy
        if: steps.enabled.outputs.on == 'true'
        uses: actions/deploy-pages@v4
